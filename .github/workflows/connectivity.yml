name: Check college connectivity
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/connectivity.yml'
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python publish.py
        env:
          SCHEDULE_DIRECT: '1'
