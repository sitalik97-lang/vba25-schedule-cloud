name: Refresh timetable
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions: {}
concurrency:
  group: timetable-refresh
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 'requests[socks]'
      - uses: actions/cache/restore@v4
        with:
          path: .proxy-state
          key: proxy-health-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: proxy-health-v1-
      - name: Fetch public timetable with ranked fallback proxies
        shell: python
        run: |
          import sys, json, tempfile
          from pathlib import Path
          from datetime import datetime, timezone
          sys.path.insert(0, '.')
          from source import HttpClient
          from updater import refresh_schedule
          from formatter import render_day
          from schedule_parser import flatten_days
          from constants import PAIR_TIMES
          import time, signal, ipaddress, requests
          from urllib.parse import urlsplit
          stats_path = Path('.proxy-state/results.json')
          try:
              stats = json.loads(stats_path.read_text())
              if not isinstance(stats, dict): stats = {}
          except (OSError, ValueError):
              stats = {}
          def valid_proxy(value):
              try:
                  u = urlsplit(value)
                  return u.scheme in ('socks5h', 'socks4a', 'http') and not u.username and not u.password and not u.query and not u.fragment and u.path in ('', '/') and ipaddress.ip_address(u.hostname).is_global and 1 <= u.port <= 65535
              except (ValueError, TypeError):
                  return False
          pool = ['socks5h://' + a for a in ['5.42.123.150:1080', '89.169.2.163:10808', '109.191.10.98:1080']]
          session = requests.Session()
          session.trust_env = False
          try:
              response = session.get('https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/countries/RU/data.txt', timeout=(5, 8))
              response.raise_for_status()
              if len(response.content) > 200000: raise ValueError('List too large')
              for line in response.text.splitlines():
                  route = line.strip().replace('socks5://', 'socks5h://').replace('socks4://', 'socks4a://')
                  if valid_proxy(route): pool.append(route)
          except Exception as exc:
              print('Proxy list unavailable:', type(exc).__name__)
          pool = list(dict.fromkeys([p for p in stats if valid_proxy(p)] + pool))[:300]
          pool.insert(0, 'direct')
          stats = {p: v for p, v in stats.items() if p in pool and isinstance(v, dict) and isinstance(v.get('history', []), list) and all(x in (0,1) for x in v.get('history', [])) and isinstance(v.get('last', 0), (int,float))}
          def rank(route):
              h = stats.get(route, {}).get('history', [])[-12:]
              rate = sum(h) / len(h) if h else 0
              # Recent failures demote a once-good route. Least recently tried breaks ties.
              streak = 0
              for result in reversed(h):
                  if result: break
                  streak += 1
              score = rate / (1 + streak)
              return (-score, stats.get(route, {}).get('last', 0))
          def record(route, ok):
              old = stats.get(route, {}).get('history', [])
              stats[route] = {'history': (old + [int(ok)])[-12:], 'last': time.time()}
              stats_path.parent.mkdir(exist_ok=True)
              stats_path.write_text(json.dumps(stats))
          def expired(signum, frame):
              raise TimeoutError('Route budget exceeded')
          signal.signal(signal.SIGALRM, expired)
          proxies = sorted(pool, key=rank)
          print('Available routes:', len(proxies))
          deadline = time.monotonic() + 210
          success = False
          for index, address in enumerate(proxies[:25]):
              remaining = int(deadline - time.monotonic())
              if remaining < 5: break
              client = HttpClient(attempts=1, timeout=(4, 10))
              client.session.trust_env = False
              client.session.proxies = {} if address == 'direct' else dict(http=address, https=address)
              signal.alarm(min(45, remaining))
              try:
                  with tempfile.TemporaryDirectory() as tmp:
                      result = refresh_schedule(client=client, schedule_path=Path(tmp)/'schedule.json', state_path=Path(tmp)/'state.json')
                      data = result['schedule']
                      payload = {'from': data['weeks'][0]['from'], 'to': data['weeks'][-1]['to'], 'checked_at': datetime.now(timezone.utc).isoformat(), 'days': {k: render_day(v) for k,v in flatten_days(data).items()}}
                      payload['lessons'] = [{'subject': entry['subject'], 'subgroup': i, 'date': day['date'], 'pair': pair['number'], 'at': day['date']+'T'+PAIR_TIMES[pair['number']][0]+':00+03:00', 'teacher': entry.get('teacher',''), 'room': entry.get('room','')} for day in flatten_days(data).values() for pair in day.get('pairs',[]) if pair['number'] in PAIR_TIMES for i,entry in enumerate(pair['subgroups'],1) if entry.get('subject')]
                      Path('payload.json').write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
                      record(address, True)
                      success = True
                      print('Timetable PDF parsed successfully; route', index + 1)
                      break
              except Exception as exc:
                  record(address, False)
                  print('Route unavailable:', index + 1, type(exc).__name__)
              finally:
                  signal.alarm(0)
                  client.session.close()
          if not success:
              print('All routes unavailable; previous cloud timetable retained.')
              raise SystemExit(1)
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.proxy-state/results.json') != ''
        with:
          path: .proxy-state
          key: proxy-health-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: timetable-payload
          path: payload.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: timetable-payload
      - name: Publish directly to Cloudflare
        shell: python
        run: |
          import os, json, urllib.request, urllib.parse, base64
          from pathlib import Path
          # This separate job receives no proxy configuration or bot token.
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          try:
              raw = Path('payload.json').read_bytes()
              data = json.loads(raw)
              assert len(raw) <= 200000 and data.get('days') and data.get('checked_at')
              url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=vba25-schedule-update'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              with opener.open(req, timeout=20) as response:
                  token = json.load(response)['value']
              claims = json.loads(base64.urlsafe_b64decode(token.split('.')[1] + '==='))
              print('Identity metadata:', {k: claims.get(k) for k in ('iss','aud','repository','repository_id','ref','sub','event_name','workflow_ref')})
              req = urllib.request.Request('https://vba25-schedule.sitalik97.workers.dev/schedule', data=raw, headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'User-Agent': 'VBA25ScheduleBot/1.0'})
              with opener.open(req, timeout=30) as response:
                  assert response.status == 200
              print('Schedule published successfully.')
          except Exception as exc:
              print('Publication failed:', type(exc).__name__, 'HTTP status:', getattr(exc, 'code', None))
              if hasattr(exc, 'read'):
                  detail = exc.read(256).decode('utf-8', errors='replace')
                  for secret in (locals().get('token', ''), os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN', '')):
                      if secret: detail = detail.replace(secret, '[redacted]')
                  print('Response:', detail)
              raise SystemExit(1) from None
